            schema:
              $ref: "#/components/schemas/UpdateSMTPCredentialRequest"
      responses:
        "200":
          description: Updated SMTP credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPCredential"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteSMTPCredential
      summary: Delete an SMTP credential (server mode)
      responses:
        "204":
          description: SMTP credential deleted
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/smtp-credentials/{id}/reveal:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: revealSMTPCredential
      summary: Reveal the decrypted password of an SMTP credential (audited, server mode)
      responses:
        "200":
          description: Decrypted SMTP password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealSMTPCredentialResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: >-
            `conflict`: the stored password cannot be decrypted with the current
            MAILCUBBY_APP_KEY (wrong or lost key). Restore the original key, or
            rotate the credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/projects/{project}/smtp-credentials/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: rotateSMTPCredential
      summary: Rotate an SMTP credential's password (username unchanged, server mode)
      responses:
        "200":
          description: Rotated SMTP credential and new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSMTPCredentialResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
