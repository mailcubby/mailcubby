          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSMTPCredentialResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/smtp-credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateSMTPCredential
      summary: Update an SMTP credential's label or disabled status (server mode)
      requestBody:
        required: true
