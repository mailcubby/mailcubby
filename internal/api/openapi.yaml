openapi: 3.1.0
info:
  title: Mailcubby API
  version: 0.1.0
  description: Self-hosted multi-tenant email testing server REST API.
  license:
    name: PolyForm Shield 1.0.0
    url: https://polyformproject.org/licenses/shield/1.0.0

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Process is running
          content:
            text/plain:
              schema:
                type: string

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      responses:
        "200":
          description: Instance is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Instance is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: OpenAPI 3.1 specification
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Instance metadata and public SMTP connection info
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaResponse"

  /api/v1/setup:
    post:
      operationId: completeSetup
      summary: Complete first-run instance setup and sign in as the initial admin (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Initial admin created and session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: Authenticate with email and password and start a session (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated user with session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the current session and clear the session cookie (server mode)
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Current caller identity and project memberships
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateAuthMe
      summary: Update current user display name or password (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAuthMeRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/sessions:
    get:
      operationId: listAuthSessions
      summary: List active browser sessions for the current user (server mode)
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteAuthSession
      summary: Revoke one of the current user's sessions (server mode)
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewInvite
      summary: Preview a pending project or instance invitation (server mode)
      responses:
        "200":
          description: Invite preview metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/invites/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acceptInvite
      summary: Accept a pending project or instance invitation (server mode)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: Invitation accepted (sets session cookie for unauthenticated signup/password set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInviteResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/password-reset/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completePasswordReset
      summary: Reset password using a single-use admin-issued token (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password updated and all sessions revoked
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List accessible projects with counters and 24-hour sparkline
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: getProject
      summary: Get project metadata and settings
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateProject
      summary: Update project metadata, slug, or settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteProject
      summary: Delete a project after confirming its slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProjectRequest"
      responses:
        "204":
          description: Project deleted
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/leave:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      operationId: leaveProject
      summary: Leave the project (server mode; fails with 409 for last owner)
      responses:
        "204":
          description: Membership removed
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/audit:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: listProjectAudit
      summary: List paginated audit log entries for the project (server mode, owner)
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from next_cursor
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: action
          in: query
          required: false
          description: Filter by exact FR-105 audit action name
          schema:
            type: string
      responses:
        "200":
          description: Paginated project audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: listMessages
      summary: List project messages newest first with cursor pagination
      parameters:
        - name: query
          in: query
          required: false
          description: Full-text search query with operators (SPEC FR-081)
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Tag name filter (case-insensitive)
          schema:
            type: string
        - name: credential
          in: query
          required: false
          description: Filter messages received via the given SMTP credential ID
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from next_cursor
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated message summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteAllMessages
      summary: Delete all messages in the project
      parameters:
        - name: query
          in: query
          required: false
          description: >-
            Optional search query filter (SPEC FR-081). With neither query nor credential,
            deletes all messages. Returns 400 when the query does not narrow the selection (SPEC FR-082).
          schema:
            type: string
        - name: credential
          in: query
          required: false
          description: Only delete messages received via the given SMTP credential ID (combined with query)
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Number of deleted messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffectedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/wait:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: waitMessage
      summary: Wait until a new or matching message arrives in the project
      parameters:
        - name: query
          in: query
          required: false
          description: Optional search query filter (SPEC FR-081); absent deletes all messages
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: ULID, RFC 3339 timestamp, or 'now' (default)
          schema:
            type: string
        - name: timeout
          in: query
          required: false
          description: Go duration string (default 30s, max MAILCUBBY_API_WAIT_MAX_TIMEOUT)
          schema:
            type: string
      responses:
        "200":
          description: Matching message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSummary"
        "204":
          description: Timed out without a matching message
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/bulk:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      operationId: bulkMessages
      summary: Apply a bulk action to multiple messages in the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMessagesRequest"
      responses:
        "200":
          description: Number of affected messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffectedResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: getMessage
      summary: Get full message detail
      responses:
        "200":
          description: Message detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetail"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: patchMessage
      summary: Update message seen state and/or tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMessageRequest"
      responses:
        "200":
          description: Updated message summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSummary"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteMessage
      summary: Delete a single message
      responses:
        "204":
          description: Message deleted
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}/raw:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: getMessageRaw
      summary: Get raw RFC 5322 message source as plain text
      responses:
        "200":
          description: Raw message source
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}/eml:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: getMessageEML
      summary: Download raw message as an .eml attachment
      responses:
        "200":
          description: Raw RFC 5322 .eml file
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}/html:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: getMessageHTML
      summary: Get extracted HTML source as plain text
      responses:
        "200":
          description: HTML body source
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}/headers:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: getMessageHeaders
      summary: Get top-level message headers in original order
      responses:
        "200":
          description: Ordered list of headers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Header"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/messages/{id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getMessageAttachment
      summary: Download or inline-display a message attachment
      parameters:
        - name: inline
          in: query
          required: false
          description: Set to 1 for inline disposition (raster images only)
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Attachment content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/send-test:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      operationId: sendTestMessage
      summary: Ingest the built-in sample message into the project
      responses:
        "201":
          description: Sample message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSummary"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/tags:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: listTags
      summary: List tags in the project with message counts
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagSummary"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createTag
      summary: Create a new tag in the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSummary"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateTag
      summary: Rename or recolor a tag in the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: Updated tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSummary"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteTag
      summary: Delete a tag and remove it from all messages in the project
      responses:
        "204":
          description: Tag deleted
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: listProjectMembers
      summary: List project members and roles (server mode)
      responses:
        "200":
          description: Project members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMember"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateProjectMember
      summary: Update a member's project role (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectMemberRequest"
      responses:
        "200":
          description: Updated project member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteProjectMember
      summary: Remove a member from the project (server mode)
      responses:
        "204":
          description: Member removed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/invites:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      operationId: listProjectInvites
      summary: List project invitations (server mode)
      responses:
        "200":
          description: Project invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectInvite"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createProjectInvite
      summary: Create a project invitation and return its one-time URL (server mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInviteRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectInviteResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/projects/{project}/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - name: id
        in: path
