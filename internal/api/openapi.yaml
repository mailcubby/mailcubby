  /render/{project}/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
    get:
      operationId: renderMessageHTML
      summary: Serve rewritten email HTML with strict sandbox CSP headers
      parameters:
        - name: images
          in: query
          required: false
          description: Set to 1 to allow remote HTTPS images when enabled
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Sandboxed HTML preview
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /render/{project}/{id}/attachments/{attachment_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/MessageID"
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: renderMessageAttachmentPDF
      summary: Serve a validated PDF attachment inline with PDF-specific CSP headers (ADR 0009)
      responses:
        "200":
          description: Inline PDF preview
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"

components:
  parameters:
    ProjectSlug:
      name: project
      in: path
      required: true
      schema:
        type: string
    MessageID:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ProjectColor:
      type: string
      enum:
        - slate
        - red
        - orange
        - amber
        - lime
        - green
        - teal
        - cyan
        - blue
        - violet
        - fuchsia
        - pink

    ProjectRole:
      type: string
      enum:
        - owner
        - member
        - viewer

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - conflict
                - login_required
                - gone
                - payload_too_large
                - unsupported_media_type
                - rate_limited
                - internal
                - service_unavailable
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string

    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        reason:
          type: string

    MetaResponse:
      type: object
      required:
        - mode
        - version
        - instance_name
        - setup_required
        - base_url
        - features
        - inbox_domain
        - smtp
      properties:
        mode:
          type: string
          enum: [local, server]
        version:
          type: string
        instance_name:
          type: string
        setup_required:
          type: boolean
        base_url:
          type: string
        features:
          type: object
          required: [remote_images, recipient_routing, inline_pdf]
          properties:
            remote_images:
              type: string
              enum: [opt-in, "off"]
            recipient_routing:
              type: boolean
            inline_pdf:
              type: boolean
        inbox_domain:
          type: string
        smtp:
          $ref: "#/components/schemas/SMTPConnectionInfo"

    SMTPConnectionInfo:
      type: object
      required: [host, port, tls_mode]
      properties:
        host:
          type: string
        port:
          type: integer
        tls_mode:
          type: string
          enum: [starttls, tls, none]

    SMTPCredential:
      type: object
      required: [id, label, username, created_at, last_used_at, disabled]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        username:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: ["string", "null"]
          format: date-time
        disabled:
          type: boolean

    SMTPCredentialListResponse:
      type: object
      required: [connection, items]
      properties:
        connection:
          $ref: "#/components/schemas/SMTPConnectionInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SMTPCredential"

    CreateSMTPCredentialRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80

    CreateSMTPCredentialResponse:
      type: object
      required: [credential, password]
      properties:
        credential:
          $ref: "#/components/schemas/SMTPCredential"
        password:
          type: string

    RevealSMTPCredentialResponse:
      type: object
      required: [password]
      properties:
        password:
          type: string

    UpdateSMTPCredentialRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        disabled:
          type: boolean

    AuthUser:
      type: object
      required: [id, email, name, is_admin, can_create_projects]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        is_admin:
          type: boolean
        can_create_projects:
          type: boolean

    SetupRequest:
      type: object
      required: [setup_token, email, name, password]
      properties:
        setup_token:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 10
          maxLength: 256
        instance_name:
          type: string
          maxLength: 80

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    PatchAuthMeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 256

    SessionSummary:
      type: object
      required: [id, created_at, last_seen_at, ip, user_agent, current]
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        current:
          type: boolean

    PasswordResetRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 256

    AuthMeResponse:
      type: object
      required: [user, csrf_token, memberships]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        csrf_token:
          type: string
        memberships:
          type: array
          items:
            type: object
            required: [project, role]
            properties:
              project:
                type: string
              role:
                $ref: "#/components/schemas/ProjectRole"
        token:
          type: object
          required: [scope]
          properties:
            scope:
              type: string
              enum: [read, write]
            project:
              type: ["string", "null"]

    ProjectSummary:
      type: object
      required:
        - id
        - slug
        - name
        - color
        - role
        - message_count
        - unread_count
        - size_bytes
