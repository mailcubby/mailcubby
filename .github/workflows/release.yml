name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install pnpm
        run: npm install -g pnpm@12.21.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build snapshot images for size verification
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean

      - name: Verify per-arch compressed image size (< 25 MB, NFR-006)
        run: |
          set -eu
          for arch in amd64 arm64; do
            img=$(docker images --format '{{.Repository}}:{{.Tag}}' ghcr.io/mailcubby/mailcubby | grep -E -- "-${arch}$" | head -n 1)
            if [ -z "$img" ]; then
              echo "Missing snapshot image for linux/${arch}" >&2
              exit 1
            fi
            size=$(docker save "$img" | gzip -c | wc -c)
            echo "linux/${arch} (${img}) compressed size: ${size} bytes"
            if [ "$size" -ge 25000000 ]; then
              echo "Image ${img} (${size} bytes) exceeds 25 MB limit" >&2
              exit 1
            fi
          done

      - name: Publish release and multi-arch images
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
