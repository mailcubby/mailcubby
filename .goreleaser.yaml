version: 2

project_name: mailcubby

before:
  hooks:
    - make web

builds:
  - id: mailcubby
    main: ./cmd/mailcubby
    binary: mailcubby
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mailcubby
    ids:
      - mailcubby
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - .env.example
      - deploy/launchd/dev.mailcubby.plist
      - deploy/systemd/mailcubby.service
      - deploy/systemd/mailcubby-server.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

dockers_v2:
  - id: mailcubby
    ids:
      - mailcubby
    dockerfile: deploy/Dockerfile.goreleaser
    images:
      - ghcr.io/mailcubby/mailcubby
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Self-hosted multi-tenant email testing server"
      org.opencontainers.image.source: "https://github.com/mailcubby/mailcubby"
      org.opencontainers.image.url: "https://github.com/mailcubby/mailcubby"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: "LicenseRef-PolyForm-Shield-1.0.0"

# Homebrew formula in mailcubby/homebrew-tap (ADR 0008). GoReleaser deprecates
# `brews` in favour of `homebrew_casks`, but only formulae support
# `brew services`, so this is deliberate: `goreleaser check` exits 2 because of
# it, while `goreleaser release` only warns.
brews:
  - name: mailcubby
    ids:
      - mailcubby
    homepage: "https://github.com/mailcubby/mailcubby"
    description: "Self-hosted multi-tenant email testing server"
    repository:
      owner: mailcubby
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "chore(formula): mailcubby {{ .Tag }}"
    # Pre-releases (v1.1.0-rc.1) do not update the tap.
    skip_upload: auto
    install: |
      bin.install "mailcubby"
    # launchd and systemd fail to start a service whose working directory is
    # missing, so create it (and the log directory) at install time.
    post_install: |
      (var/"mailcubby").mkpath
      (var/"log").mkpath
    service: |
      run [opt_bin/"mailcubby", "serve"]
      environment_variables MAILCUBBY_MODE: "local", MAILCUBBY_DATA_DIR: var/"mailcubby"
      working_dir var/"mailcubby"
      keep_alive true
      log_path var/"log/mailcubby.log"
      error_log_path var/"log/mailcubby.log"
    caveats: |
      Mailcubby runs in local mode: no authentication, listening on all interfaces.
      Do not expose it to untrusted networks. To listen on loopback only
      (Homebrew 6.0.15 or later), put
        MAILCUBBY_HTTP_ADDR=127.0.0.1:8025
        MAILCUBBY_SMTP_ADDR=127.0.0.1:1025
      in ~/.homebrew/services/mailcubby.env ($XDG_CONFIG_HOME/homebrew/services/mailcubby.env
      if XDG_CONFIG_HOME is set) and run `brew services restart mailcubby`.
      On older Homebrew, run `mailcubby serve` yourself with those variables instead.
      Web UI: http://localhost:8025   SMTP: localhost:1025
      Data: #{var}/mailcubby   Log: #{var}/log/mailcubby.log
    test: |
      assert_match version.to_s, shell_output("#{bin}/mailcubby version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore\\(deps\\):"

release:
  github:
    owner: mailcubby
    name: mailcubby
  prerelease: auto
