# Local development setup (no authentication — bound to 127.0.0.1 only).
# Usage: docker compose -f deploy/compose.local.yml up -d
#
# To build from source instead of pulling the published image, uncomment the
# build block below and run with --build.
name: mailcubby-local

services:
  mailcubby:
    image: ghcr.io/mailcubby/mailcubby:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # MAILCUBBY_MODE is left unset on purpose: it defaults to local, and an
      # unset mode makes Mailcubby refuse a data dir that already has users
      # (server-mode data), instead of opening it without login.
      MAILCUBBY_DATA_DIR: /data
    ports:
      - "127.0.0.1:8025:8025" # Web UI and REST API
      - "127.0.0.1:1025:1025" # SMTP
    volumes:
      - mailcubby-data:/data

volumes:
  mailcubby-data:
