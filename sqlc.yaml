version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/queries"
    schema:
      - "migrations/00001_init.sql"
      - "migrations/00003_projects_autoincrement.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "database/sql"
        emit_empty_slices: true
